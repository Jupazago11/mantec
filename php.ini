; Limite explicito de subida para evidencia de reportes (fotos/videos).
; Antes de este archivo, produccion corria sin ningun php.ini cargado y
; upload_max_filesize/post_max_size quedaban en "0", un valor no documentado
; como "sin limite" para upload_max_filesize (a diferencia de post_max_size,
; que si esta documentado como ilimitado en 0). Se fija un techo alto pero
; explicito para no depender de ese comportamiento accidental.
upload_max_filesize = 1024M
post_max_size = 1100M
max_execution_time = 300
max_input_time = 300
